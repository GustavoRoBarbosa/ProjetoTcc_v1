name: CI

on: [push, pull_request]

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: tcc
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        env:
            DB_NAME: tcc
            DB_USER: root
            DB_PASSWORD: root
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            SECRET_KEY: chave-temporaria-para-ci

        steps:
            - name: Checkout do codigo
              uses: actions/checkout@v4

            - name: Configurar Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"

            - name: Instalar dependencias
              working-directory: ./backend
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: Rodar Testes
              working-directory: ./backend
              run: python manage.py test

            - name: Build
              working-directory: ./backend
              run: python manage.py check --deploy

    # Mesmos testes, mas rodando DENTRO dos containers (docker-compose.test.yml).
    # Garante que a imagem Docker do backend funciona, não só o código na máquina do CI.
    docker-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout do codigo
              uses: actions/checkout@v4

            - name: Rodar testes com Docker Compose
              run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests

            - name: Build da imagem do frontend
              run: docker build -t tcc-frontend ./frontend

            - name: Limpar containers de teste
              if: always()
              run: docker compose -f docker-compose.test.yml down -v
