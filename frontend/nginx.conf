server {
    listen 80;

    # Uploads de imagem de peça (o padrão do nginx é só 1 MB)
    client_max_body_size 10m;

    # Proxy reverso: tudo que começa com /api/, /media/ ou /admin/ é repassado
    # para o container "backend". O nome "backend" é o nome do serviço no
    # docker-compose.yml: o DNS interno do Docker resolve ele para o IP certo.
    location ~ ^/(api|media|admin)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos do React (HTML/CSS/JS gerados pelo npm run build)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA: rotas como /login ou /carrinho não existem como arquivo;
        # devolve o index.html e o React Router decide o que mostrar.
        try_files $uri $uri/ /index.html;
    }
}
